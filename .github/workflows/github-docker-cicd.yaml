name: Github-Docker Hub MLOps pipeline - Loan Prediction Model

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  REPO_NAME: ${{ secrets.REPO_NAME }}

jobs:
  ci_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==24.8.0 pylint==3.2.6 pytest==8.3.2
          # Dépendances de l'app pour exécuter import/app (si besoin)
          if [ -f requirements-infer.txt ]; then pip install -r requirements-infer.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Format
        run: |
          black --check app.py || (echo "Formatting app.py" && black app.py && git diff --exit-code || true)

      - name: Lint
        run: |
          pylint --disable=R,C app.py

      - name: Tests
        run: |
          pytest -q -vv test.py

  cd_pipeline:
    runs-on: ubuntu-latest
    needs: [ci_pipeline]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USER}" --password-stdin

      - name: Compute tags
        id: vars
        run: |
          ts=$(date +'%Y%m%d-%H%M%S')
          echo "DATE_TAG=${ts}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "LATEST=true" >> "$GITHUB_OUTPUT"
          else
            echo "LATEST=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        run: |
          docker build . -f Dockerfile -t ${DOCKER_USER}/${REPO_NAME}:${{ steps.vars.outputs.DATE_TAG }}

      - name: Tag latest (main only)
        if: steps.vars.outputs.LATEST == 'true'
        run: |
          docker tag ${DOCKER_USER}/${REPO_NAME}:${{ steps.vars.outputs.DATE_TAG }} ${DOCKER_USER}/${REPO_NAME}:latest

      - name: Push dated tag
        run: docker push ${DOCKER_USER}/${REPO_NAME}:${{ steps.vars.outputs.DATE_TAG }}

      - name: Push latest (main only)
        if: steps.vars.outputs.LATEST == 'true'
        run: docker push ${DOCKER_USER}/${REPO_NAME}:latest
